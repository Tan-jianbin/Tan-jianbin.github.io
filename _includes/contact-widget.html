<section class="mail-panel" id="mailPanel" aria-label="Email Jianbin" aria-hidden="true">
  <header class="mail-head">
    <img src="{{ "/assets/img/email-assistant.png" | relative_url }}" alt="Email assistant avatar">
    <div class="mail-title">
      <strong>Email to Jianbin</strong>
      <span>Direct message · Delivered by email</span>
    </div>
    <button class="close-mail" id="closeMail" type="button" aria-label="Close email form">×</button>
  </header>

  <div class="mail-content">
    <div class="mail-form-view" id="mailFormView">
      <form class="direct-mail-form" id="directMailForm">
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" hidden>
        <input type="hidden" name="_subject" value="New message from Jianbin's personal website">
        <input type="hidden" name="_captcha" value="false">

        <div class="mail-field">
          <label for="visitorEmail">Your email</label>
          <input id="visitorEmail" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
        </div>

        <div class="mail-field">
          <label for="visitorMessage">Message</label>
          <textarea id="visitorMessage" name="message" placeholder="Write your message to Jianbin…" required></textarea>
        </div>

        <button class="send-mail" id="sendMail" type="submit">Send Message</button>
        <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        <button class="retry-mail" id="retryMail" type="button" hidden>Try again</button>
      </form>
    </div>

    <div class="mail-success" id="mailSuccess" role="status" aria-live="polite" hidden>
      <div class="success-mark" aria-hidden="true">✓</div>
      <h3>Message sent</h3>
      <p>Thank you. I’ll reply as soon as possible.</p>
      <button class="send-another" id="sendAnother" type="button">Send another message</button>
    </div>
  </div>
</section>

<div class="mail-launcher-wrap">
  <button class="mail-launcher" id="mailLauncher" type="button" aria-label="Open email form" aria-expanded="false" aria-controls="mailPanel">
    <img src="{{ "/assets/img/email-assistant.png" | relative_url }}" alt="">
  </button>
  <span class="launcher-note">Email Jianbin</span>
</div>
